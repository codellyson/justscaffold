# Deploys the builder page to Cloudflare Pages.
#
# web/registry.js is generated, not committed, so the site cannot be published
# straight from a checkout — `web/` on its own is an index.html whose every
# dynamic panel renders empty. Cloudflare's git integration can only be told to
# run a build from the dashboard, which puts a load-bearing step outside the
# repo; deploying by direct upload from here keeps it in version control.
#
# Requires CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID as repository secrets. Until both are set the deploy
# step is skipped rather than failed, so this cannot redden CI on its own.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - web/**
      - templates/**
      - src/**
      - scripts/gen-web.ts
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

# A queued deploy should replace an in-flight one, never race it.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the real generator over the real templates, so the page describes
      # what the CLI currently emits rather than a snapshot of what it once did.
      - name: Build the page
        run: npm run gen:web

      - name: Fail if the build produced nothing
        run: test -s web/registry.js

      - name: Deploy to Cloudflare Pages
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=justscaffold --branch=main

      - name: Explain the skip
        if: env.CONFIGURED != 'true'
        run: |
          echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the page was built but not published. Add both under Settings -> Secrets and variables -> Actions."
