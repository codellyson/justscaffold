# Deploys the builder page — a Worker serving only static assets, configured in
# wrangler.jsonc.
#
# web/registry.js is generated, not committed, so the site cannot be published
# straight from a checkout: `web/` on its own is an index.html whose registry.js
# 404s and whose every dynamic panel renders empty. The build has to run first,
# and running it here keeps that step in version control rather than in a
# dashboard build command nobody reviews.
#
# Requires CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CLOUDFLARE_ACCOUNT_ID as repository secrets. Until both are set the deploy
# step is skipped rather than failed, so this cannot redden CI on its own.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - web/**
      - templates/**
      - src/**
      - scripts/gen-web.ts
      - package.json
      - package-lock.json
      - wrangler.jsonc
      - .github/workflows/deploy.yml
  workflow_dispatch:

# A queued deploy should replace an in-flight one, never race it.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the real generator over the real templates, so the page describes
      # what the CLI currently emits rather than a snapshot of what it once did.
      - name: Build the page
        run: npm run gen:web

      - name: Fail if the build produced nothing
        run: test -s web/registry.js

      - name: Deploy the Worker
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Explain the skip
        if: env.CONFIGURED != 'true'
        run: |
          echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the page was built but not published. Add both under Settings -> Secrets and variables -> Actions."
