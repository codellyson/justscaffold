# Cheap by design: install, typecheck, build, test. The generator tests write
# to a temp dir and never shell out to npm, so this stays under a minute.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Guards the thing unit tests can't: that a generated project actually
  # installs and compiles. Matrixed so a break points at one template.
  #
  # `pm` is the package manager the generated project expects, not a
  # preference: the tauri and web templates are pnpm workspaces whose scripts
  # shell out to `pnpm -r`, so running them under npm dies with
  # "pnpm: not found" long before anything template-specific is exercised.
  generated:
    runs-on: ubuntu-latest
    needs: build
    env:
      # corepack fetches the pnpm pinned by the generated project's
      # packageManager field, and prompts for confirmation unless told not to.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: lib
            features: vitest,github-actions,release-script
            pm: npm
          - template: cli
            features: vitest,github-actions
            pm: npm
          - template: mcp
            features: vitest,docker
            pm: npm
          - template: api
            features: auth,vitest,docker,github-actions
            pm: npm
          - template: extension
            features: vitest,github-actions,release-script
            pm: npm
          - template: web
            features: github-actions,release-script
            pm: pnpm
          - template: tauri
            features: github-actions,release-script
            pm: pnpm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable corepack
        if: matrix.pm == 'pnpm'
        run: corepack enable

      # Tauri's Rust side needs GTK/webkit headers to compile on Linux. Without
      # these the job dies inside a C build with an error that looks nothing
      # like a Rust one.
      - name: Install Linux webview dependencies
        if: matrix.template == 'tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.template == 'tauri'

      - run: npm ci
      - run: npm run build

      - name: Generate
        run: node dist/index.js new sample -t ${{ matrix.template }} -f ${{ matrix.features }} -y --dir /tmp/sample

      - name: Install and build the generated project
        working-directory: /tmp/sample
        run: |
          ${{ matrix.pm }} install
          ${{ matrix.pm }} run build
          # --if-present leads the script name: pnpm only reads it as a flag
          # there, and forwards it as a script argument if it trails.
          ${{ matrix.pm }} run --if-present test

      # cargo check, not build: it catches the type and borrow errors that
      # template drift actually produces, without paying for codegen.
      - name: Check the generated Rust backend
        if: matrix.template == 'tauri'
        working-directory: /tmp/sample/src-tauri
        run: cargo check
